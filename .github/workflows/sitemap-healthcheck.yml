name: Sitemap Healthcheck

# サイトマップに載っているURLが本当に200を返すかを毎日確認する。
#
# なぜ要るか（2026-08-24〜28の実害）:
#   PR #297 の ISR 化リファクタで dynamicParams=false が入り、
#   投入したコラムが再デプロイまで 404 を返す状態が4日間続いた。
#   その間に Google がクロールして 404 を見たため、
#   インデックス登録済みページが 2,400 → 589 へ約75%減少した（GSC実測 2026-09-16）。
#   原因は PR #304 で除去済みだが、4日間気づけなかったこと自体が穴だった。
#
# 設計の考え方:
#   - 全URLは叩かない（1,200件超あり負荷が大きい）。無作為に40件を抜き取る。
#     5%のURLが壊れている場合、1日で気づく確率は約87%、2日で98%を超える。
#   - サイトマップ自体が取れない・URL数が急減した場合も異常として拾う。
#   - 失敗したら Issue を立てる（token-healthcheck と同じ型）。

on:
  schedule:
    # 毎日 23:40 UTC = 翌 08:40 JST（daily-columns の投入後に回す）
    - cron: "40 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: サイトマップを取得して無作為40件の疎通を確認する
        id: check
        continue-on-error: true
        run: |
          set -uo pipefail
          SITEMAP="https://luck428.com/sitemap.xml"

          echo "::group::サイトマップ取得"
          CODE=$(curl -s -o /tmp/sitemap.xml -w "%{http_code}" --max-time 60 "$SITEMAP")
          echo "sitemap HTTP=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "SUMMARY=サイトマップ自体が取得できません（HTTP $CODE）" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::endgroup::"

          TOTAL=$(grep -c "<loc>" /tmp/sitemap.xml || echo 0)
          echo "URL総数: $TOTAL"
          echo "TOTAL=$TOTAL" >> "$GITHUB_OUTPUT"

          # URL数が極端に少ない＝サイトマップ生成の破損を疑う
          if [ "$TOTAL" -lt 200 ]; then
            echo "SUMMARY=サイトマップのURL数が $TOTAL 件しかありません（通常1,000件超）" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # sed の "</\?loc>" は GNU sed でしか効かない（BSD sed では ? が literal 扱い）。
          # ローカル検証で全URLが HTTP 000 になり実際に踏んだため、2つに分けて書く（2026-09-16）。
          grep -o "<loc>[^<]*</loc>" /tmp/sitemap.xml \
            | sed -e "s|<loc>||" -e "s|</loc>||" \
            | shuf -n 40 > /tmp/sample.txt

          # 抜き取りが空でも NG=0 になり「偽の緑」になるため、件数を必ず確かめる
          # （ローカル検証で shuf 不在により実際に踏んだ穴。2026-09-16）
          SAMPLED=$(wc -l < /tmp/sample.txt | tr -d " ")
          echo "抜き取り件数: $SAMPLED"
          if [ "$SAMPLED" -lt 40 ]; then
            echo "SUMMARY=URLの抜き取りに失敗しました（$SAMPLED 件。40件必要）。チェック自体が機能していません" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::group::40件の疎通確認"
          : > /tmp/ng.txt
          while read -r u; do
            c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                  -H "Cache-Control: no-cache" "$u")
            if [ "$c" != "200" ]; then
              echo "$c $u" | tee -a /tmp/ng.txt
            fi
          done < /tmp/sample.txt
          echo "::endgroup::"

          NG=$(wc -l < /tmp/ng.txt | tr -d " ")
          echo "NG=$NG" >> "$GITHUB_OUTPUT"
          if [ "$NG" -gt 0 ]; then
            {
              echo "SUMMARY<<SUMEOF"
              echo "サイトマップ掲載URLのうち $NG / 40 件が200を返しませんでした。"
              echo ""
              cat /tmp/ng.txt
              echo "SUMEOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "全40件が200でした（総URL数 $TOTAL）"

      - name: 異常があれば Issue を立てる
        if: steps.check.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.check.outputs.SUMMARY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "サイトマップの疎通確認が失敗（インデックス減少の前兆）" \
            --body "${SUMMARY}

          **なぜこれが重大か**
          サイトマップに載っているURLが404等を返すと、Googleがクロールした時点で
          インデックスから外れます。2026-08-24〜28に同じことが起き、
          登録済みページが 2,400 → 589 へ約75%減りました（原因は PR #297、修正は PR #304）。

          **確認の順序**
          1. 上のURLをブラウザで開き、実際に落ちているかを見る
          2. 落ちている場合、直近のデプロイで何が変わったかを git log で確認する
             （とくに generateStaticParams・dynamicParams・revalidate に触れた変更）
          3. コラム投入直後なら、再デプロイまで404になっていないかを疑う
          4. 直したら Actions から本ワークフローを手動実行し、緑になることを確認する

          実行ログ: ${RUN_URL}"
